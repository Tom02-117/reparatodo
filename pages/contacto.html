<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | ReparaTodo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="brand-logo">ReparaTodo</a>
                <nav class="main-nav">
                    <a href="cursos.html">Cursos</a>
                    <a href="planes.html">Planes</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="container">
                <h1>Hablemos</h1>
                <p>¿Dudas, sugerencias o propuestas? Escríbenos. Leemos y respondemos cada mensaje.</p>
            </div>
        </div>
        
        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="form-wrapper">
                    <form action="#" method="post">
                        <div class="form-group">
                            <label for="email">Tu Email</label>
                            <input class="form-input" type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="mensaje">Tu Mensaje</label>
                            <textarea class="form-input" id="mensaje" name="mensaje" rows="6" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container"><p>&copy; 2024 ReparaTodo. El conocimiento es poder.</p></div>
    </footer>
</body>
</html>
